name: Postbox portable checks
on:
  push:
    branches: [main]
    paths: ['postbox/**', '.github/workflows/postbox-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source search and navigation
        run: node postbox/app/test_search.cjs
      - name: Test packaged Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .postbox-runtime
          tar -xzf postbox/downloads/Postbox-linux-x64.tar.gz -C .postbox-runtime
          cd .postbox-runtime/Postbox-linux-x64
          ./runtime/python/bin/python3 -I app.py --help
          ./runtime/python/bin/python3 -m unittest -v test_viewer.py test_previews.py test_organizer.py test_outlook.py
      - name: Test packaged Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive postbox/downloads/Postbox-windows-x64.zip .postbox-runtime
          Set-Location .postbox-runtime/Postbox-windows-x64
          & .\runtime\python.exe -I app.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\runtime\python.exe -m unittest -v test_viewer.py test_previews.py test_organizer.py test_outlook.py
          exit $LASTEXITCODE
